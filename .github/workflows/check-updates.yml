name: Check component updates

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare bundled versions with upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_versions.py --root .
